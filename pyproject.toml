[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "techscout-ai"
version = "0.2.0"
description = "GraphRAG para inteligência de mercado: grafo de conhecimento extraído por LLM combinado com busca vetorial"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Apenas o que é de fato importado. `langchain` e `langchain-community`
# constavam antes sem nenhum import correspondente no código.
dependencies = [
  "streamlit>=1.40",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langchain-chroma>=0.2",
  "chromadb>=0.5",
  "networkx>=3.2",
  "pydantic>=2.7",
  "pyvis>=0.3.2",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "feedparser>=6.0",
  # chromadb exige sqlite3 >= 3.35; imagens slim costumam trazer versão antiga.
  "pysqlite3-binary; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "coverage>=7.6.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Os testes acessam _parse_response de propósito: é a fronteira frágil do
# módulo (texto livre de LLM) e merece cobertura direta.
"tests/*" = ["SLF001"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["techscout"]
omit = [
  # Camada de UI Streamlit: exercitada manualmente, não em teste unitário.
  "*/techscout/app_streamlit.py",
  "*/techscout/ui/*",
]
