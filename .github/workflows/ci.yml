name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Run tests with branch coverage
        # A suíte roda sem OPENAI_API_KEY: os caminhos que exigem rede são
        # cobertos por injeção de dependência ou pelo fallback sem chave.
        run: |
          coverage run -m pytest -q
          coverage report --show-missing --skip-covered --fail-under=75
          coverage json -o coverage.json

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: coverage.json
          if-no-files-found: error
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag techscout-ai:ci .
