name: Keep demo awake

# O free tier do Render hiberna após 15 min ociosos; um ping a cada 10 min
# mantém a demo acordada dentro das 750h/mês do plano gratuito.
# A URL vem da variável de repositório DEMO_URL (definida pelo wizard de deploy).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthcheck
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          if [ -z "$DEMO_URL" ]; then
            echo "DEMO_URL não definida — nada para fazer ainda."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 "$DEMO_URL/_stcore/health"
